name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-changelog:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract tag annotation
        id: tagbody
        shell: bash
        run: |
          # actions/checkout overwrites the annotated tag with a lightweight one
          # pointing at the commit, so %(contents) would return the commit
          # message. Re-fetch the real annotated tag object first.
          git fetch --force origin \
            "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          body=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          {
            echo 'body<<TAGEOF'
            echo "$body"
            echo 'TAGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.tagbody.outputs.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LAZYSHEET_APP_TOKEN: ${{ secrets.LAZYSHEET_APP_TOKEN }}
        run: |
          # Derive the final (non-rc) tag name; for bare tags FINAL_TAG == TAG
          FINAL_TAG="${TAG%-rc.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add lazysheet \
            "https://x-access-token:${LAZYSHEET_APP_TOKEN}@github.com/triasbrata/lazysheet.git"
          # Base the changelog commit on the live tip of the target branch so the
          # push fast-forwards (the tag commit is behind that tip).
          git fetch lazysheet "$DEFAULT_BRANCH"
          git checkout -B changelog-sync "lazysheet/${DEFAULT_BRANCH}"
          if grep -q "^## ${FINAL_TAG} " changelog-app.log 2>/dev/null; then
            echo "changelog-app.log already contains ${FINAL_TAG}; nothing to do."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          ENTRY="## ${FINAL_TAG} (${DATE})\n\n${BODY}\n\n---\n\n"
          if [ -f changelog-app.log ]; then
            OLD=$(cat changelog-app.log)
            printf "%b%s" "$ENTRY" "$OLD" > changelog-app.log
          else
            printf "%b" "$ENTRY" > changelog-app.log
          fi
          git add -f changelog-app.log
          git commit -m "chore: update changelog for ${FINAL_TAG}"
          git push lazysheet "HEAD:${DEFAULT_BRANCH}"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are produced unsigned. To enable codesigning, add the
          # APPLE_* repo secrets and restore them as env vars here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      # Bundled libwayland-*/libEGL* from the ubuntu-22.04 runner clash with the
      # host Mesa stack on Fedora/Arch, producing "Could not create default EGL
      # display: EGL_BAD_PARAMETER" and a blank window. Strip those libs so the
      # host's own Mesa/Wayland stack is used — exactly how the deb/rpm behaves.
      # See: tauri-apps/tauri#11988
      - name: Fix AppImage bundled graphics libs
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri/target/release/bundle/appimage

          # Locate the single *.AppImage produced by tauri-action
          APPIMAGE=$(ls *.AppImage 2>/dev/null | grep -v '\.tar\.gz' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No *.AppImage found in bundle/appimage — aborting strip step."
            exit 1
          fi
          echo "Patching AppImage: $APPIMAGE"

          # Record whether updater artifacts existed before repack
          HAVE_TARGZ=false
          HAVE_SIG=false
          [ -f "${APPIMAGE}.tar.gz" ] && HAVE_TARGZ=true
          [ -f "${APPIMAGE}.sig" ]    && HAVE_SIG=true

          # Extract (no FUSE required)
          ./"$APPIMAGE" --appimage-extract

          # Strip bundled Wayland/EGL libs that clash with host Mesa
          rm -f \
            squashfs-root/usr/lib/libwayland-*.so* \
            squashfs-root/usr/lib/libEGL*.so* \
            squashfs-root/lib/libwayland-*.so* \
            squashfs-root/lib/libEGL*.so*

          # Audit log — confirm removal (informational; empty output = all stripped)
          echo "=== Remaining graphics-related libs after strip ==="
          find squashfs-root \( -name 'lib*wayland*' -o -name 'libEGL*' -o -name 'libGL*' \) | sort || true

          # Download appimagetool (pinned continuous release, x86_64)
          curl -fsSL --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # Repack, overwriting the original AppImage in place
          # --appimage-extract-and-run avoids FUSE requirement on CI containers
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            squashfs-root "$APPIMAGE"
          echo "Repacked: $APPIMAGE"

          # Re-create updater artifacts if they existed before repack
          if $HAVE_TARGZ; then
            echo "Recreating ${APPIMAGE}.tar.gz"
            tar czf "${APPIMAGE}.tar.gz" "$APPIMAGE"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "Re-signing ${APPIMAGE}.tar.gz"
              bun x @tauri-apps/cli signer sign "${APPIMAGE}.tar.gz"
            else
              echo "TAURI_SIGNING_PRIVATE_KEY not set — skipping tar.gz re-sign."
            fi
          else
            echo "No ${APPIMAGE}.tar.gz existed before repack — skipping."
          fi

          if $HAVE_SIG; then
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "Re-signing ${APPIMAGE}"
              bun x @tauri-apps/cli signer sign "$APPIMAGE"
            else
              echo "TAURI_SIGNING_PRIVATE_KEY not set — skipping AppImage re-sign."
            fi
          else
            echo "No ${APPIMAGE}.sig existed before repack — skipping."
          fi

          # Cleanup temporary extraction artifacts
          rm -rf squashfs-root appimagetool-x86_64.AppImage

      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Derive tag variables
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          FINAL_TAG="${TAG%-rc.*}"
          if [ "$TAG" != "$FINAL_TAG" ]; then
            IS_RC=true
          else
            IS_RC=false
          fi
          echo "TAG=${TAG}"           >> "$GITHUB_ENV"
          echo "FINAL_TAG=${FINAL_TAG}" >> "$GITHUB_ENV"
          echo "IS_RC=${IS_RC}"       >> "$GITHUB_ENV"

      - name: Extract tag annotation
        id: tagbody
        shell: bash
        run: |
          # actions/checkout overwrites the annotated tag with a lightweight one
          # pointing at the commit, so %(contents) would return the commit
          # message. Re-fetch the real annotated tag object first.
          git fetch --force origin \
            "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          body=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          {
            echo 'body<<TAGEOF'
            echo "$body"
            echo 'TAGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: artifacts/

      - name: Promote RC to final tag
        if: env.IS_RC == 'true'
        shell: bash
        env:
          ANNOTATION_BODY: ${{ steps.tagbody.outputs.body }}
        run: |
          # pushed with GITHUB_TOKEN on purpose — it does NOT trigger workflows, the release is already published by this run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fetch the final tag from remote in case a previous re-run already created it
          git fetch origin "refs/tags/${FINAL_TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${FINAL_TAG}" >/dev/null 2>&1; then
            EXISTING_COMMIT="$(git rev-parse "refs/tags/${FINAL_TAG}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${FINAL_TAG}")"
            if [ "$EXISTING_COMMIT" = "${{ github.sha }}" ]; then
              echo "Final tag ${FINAL_TAG} already exists at this commit — skipping creation (idempotent re-run)."
            else
              echo "::error::${FINAL_TAG} already exists at a different commit (${EXISTING_COMMIT}); refusing to overwrite."
              exit 1
            fi
          else
            git tag -a "${FINAL_TAG}" "${{ github.sha }}" -m "${ANNOTATION_BODY}"
            git push origin "${FINAL_TAG}"
            echo "Promoted ${TAG} -> ${FINAL_TAG} at ${{ github.sha }}"
          fi

      - name: Mirror tag to lazysheet
        shell: bash
        run: |
          git remote add lazysheet \
            "https://x-access-token:${{ secrets.LAZYSHEET_APP_TOKEN }}@github.com/triasbrata/lazysheet.git"
          git push lazysheet "${FINAL_TAG}"

      - name: Generate latest.json
        shell: bash
        run: |
          VERSION="${FINAL_TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES="${{ steps.tagbody.outputs.body }}"

          # Helper: find a file matching a glob under artifacts/, return empty string if absent
          find_artifact() {
            local pattern="$1"
            find artifacts -type f -name "$pattern" 2>/dev/null | head -n 1
          }

          PLATFORMS_JSON=""

          # darwin-aarch64: *.app.tar.gz + *.app.tar.gz.sig
          MAC_BUNDLE="$(find_artifact '*.app.tar.gz')"
          MAC_SIG="$(find_artifact '*.app.tar.gz.sig')"
          if [ -n "$MAC_BUNDLE" ] && [ -n "$MAC_SIG" ]; then
            MAC_FILENAME="$(basename "$MAC_BUNDLE")"
            MAC_SIGNATURE="$(cat "$MAC_SIG")"
            MAC_URL="https://github.com/triasbrata/lazysheet/releases/download/${FINAL_TAG}/${MAC_FILENAME}"
            PLATFORMS_JSON="${PLATFORMS_JSON}$(jq -n \
              --arg sig "$MAC_SIGNATURE" \
              --arg url "$MAC_URL" \
              '{"signature":$sig,"url":$url}')"
            PLATFORMS_JSON="\"darwin-aarch64\":${PLATFORMS_JSON}"
            DARWIN_ENTRY="\"darwin-aarch64\":$(jq -n --arg sig "$MAC_SIGNATURE" --arg url "$MAC_URL" '{"signature":$sig,"url":$url}')"
          else
            echo "::warning::darwin-aarch64 updater bundle or sig not found — omitting from latest.json"
            DARWIN_ENTRY=""
          fi

          # linux-x86_64: *.AppImage.tar.gz + *.AppImage.tar.gz.sig
          LINUX_BUNDLE="$(find_artifact '*.AppImage.tar.gz')"
          LINUX_SIG="$(find_artifact '*.AppImage.tar.gz.sig')"
          if [ -n "$LINUX_BUNDLE" ] && [ -n "$LINUX_SIG" ]; then
            LINUX_FILENAME="$(basename "$LINUX_BUNDLE")"
            LINUX_SIGNATURE="$(cat "$LINUX_SIG")"
            LINUX_URL="https://github.com/triasbrata/lazysheet/releases/download/${FINAL_TAG}/${LINUX_FILENAME}"
            LINUX_ENTRY="\"linux-x86_64\":$(jq -n --arg sig "$LINUX_SIGNATURE" --arg url "$LINUX_URL" '{"signature":$sig,"url":$url}')"
          else
            echo "::warning::linux-x86_64 updater bundle or sig not found — omitting from latest.json"
            LINUX_ENTRY=""
          fi

          # windows-x86_64: *-setup.exe + *-setup.exe.sig
          WIN_BUNDLE="$(find_artifact '*-setup.exe')"
          WIN_SIG="$(find_artifact '*-setup.exe.sig')"
          if [ -n "$WIN_BUNDLE" ] && [ -n "$WIN_SIG" ]; then
            WIN_FILENAME="$(basename "$WIN_BUNDLE")"
            WIN_SIGNATURE="$(cat "$WIN_SIG")"
            WIN_URL="https://github.com/triasbrata/lazysheet/releases/download/${FINAL_TAG}/${WIN_FILENAME}"
            WIN_ENTRY="\"windows-x86_64\":$(jq -n --arg sig "$WIN_SIGNATURE" --arg url "$WIN_URL" '{"signature":$sig,"url":$url}')"
          else
            echo "::warning::windows-x86_64 updater bundle or sig not found — omitting from latest.json"
            WIN_ENTRY=""
          fi

          # Build platforms object from whichever entries are non-empty
          PLATFORM_PARTS=()
          [ -n "$DARWIN_ENTRY" ] && PLATFORM_PARTS+=("$DARWIN_ENTRY")
          [ -n "$LINUX_ENTRY"  ] && PLATFORM_PARTS+=("$LINUX_ENTRY")
          [ -n "$WIN_ENTRY"    ] && PLATFORM_PARTS+=("$WIN_ENTRY")

          if [ ${#PLATFORM_PARTS[@]} -eq 0 ]; then
            echo "::error::No updater platforms found — latest.json would be empty. Aborting."
            exit 1
          fi

          # Join parts with commas and wrap in {}
          PLATFORMS_JOINED=$(printf '%s\n' "${PLATFORM_PARTS[@]}" | paste -sd ',')

          jq -n \
            --arg version "$VERSION" \
            --arg notes   "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "{${PLATFORMS_JOINED}}" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:$platforms}' \
            > artifacts/latest.json

          echo "Generated artifacts/latest.json:"
          cat artifacts/latest.json

      - name: Create release in lazysheet-app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LAZYSHEET_APP_TOKEN }}
          RELEASE_BODY: ${{ steps.tagbody.outputs.body }}
        run: |
          {
            echo "$RELEASE_BODY"
            echo
            echo "---"
            echo
            echo "### macOS — first launch"
            echo
            echo "Builds are unsigned, so macOS may report the app as \"damaged\". Remove the quarantine flag once, then open normally:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/LazySheet.app"'
            echo '```'
            echo
            echo "---"
            echo
            echo "### Linux — which file?"
            echo
            echo "| Package | Distro |"
            echo "|---------|--------|"
            echo "| \`.rpm\` | Fedora / openSUSE / RHEL |"
            echo "| \`.deb\` | Ubuntu / Debian / Mint |"
            echo "| \`.AppImage\` | Portable — any distro |"
            echo
            echo "> **Blank window on Fedora/Arch with AppImage?**  Prefer the \`.rpm\` package instead. The AppImage EGL clash is fixed in releases after v0.4.0; if you're on an older version see the README troubleshooting section."
          } > /tmp/release-notes.md
          # download-artifact preserves the bundle/ subdir layout, so artifacts/
          # holds files (dmg) alongside dirs (deb, appimage, msi, nsis). gh only
          # uploads files, so collect them recursively.
          mapfile -t FILES < <(find artifacts -type f)
          if gh release view "${FINAL_TAG}" --repo triasbrata/lazysheet >/dev/null 2>&1; then
            gh release edit "${FINAL_TAG}" \
              --repo triasbrata/lazysheet \
              --notes-file /tmp/release-notes.md
            gh release upload "${FINAL_TAG}" \
              --repo triasbrata/lazysheet \
              --clobber "${FILES[@]}"
          else
            gh release create "${FINAL_TAG}" \
              --repo triasbrata/lazysheet \
              --title "LazySheet ${FINAL_TAG}" \
              --notes-file /tmp/release-notes.md \
              "${FILES[@]}"
          fi

      - name: Delete workflow artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Assets now live on the lazysheet release; drop the Actions artifacts
          # from lazysheet-app to avoid storage bloat.
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"
          done
