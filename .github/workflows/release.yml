name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract tag annotation
        id: tagbody
        shell: bash
        run: |
          body=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          {
            echo 'body<<TAGEOF'
            echo "$body"
            echo 'TAGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.tagbody.outputs.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LAZYSHEET_APP_TOKEN: ${{ secrets.LAZYSHEET_APP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add lazysheet \
            "https://x-access-token:${LAZYSHEET_APP_TOKEN}@github.com/triasbrata/lazysheet.git"
          # Base the changelog commit on the live tip of the target branch so the
          # push fast-forwards (the tag commit is behind that tip).
          git fetch lazysheet "$DEFAULT_BRANCH"
          git checkout -B changelog-sync "lazysheet/${DEFAULT_BRANCH}"
          if grep -q "^## ${TAG} " changelog-app.log 2>/dev/null; then
            echo "changelog-app.log already contains ${TAG}; nothing to do."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          ENTRY="## ${TAG} (${DATE})\n\n${BODY}\n\n---\n\n"
          if [ -f changelog-app.log ]; then
            OLD=$(cat changelog-app.log)
            printf "%b%s" "$ENTRY" "$OLD" > changelog-app.log
          else
            printf "%b" "$ENTRY" > changelog-app.log
          fi
          git add -f changelog-app.log
          git commit -m "chore: update changelog for ${TAG}"
          git push lazysheet "HEAD:${DEFAULT_BRANCH}"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: deno install

      - name: Run tests
        run: deno task test

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are produced unsigned. To enable codesigning, add the
          # APPLE_* repo secrets and restore them as env vars here.
        with:
          args: ${{ matrix.args }}

      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract tag annotation
        id: tagbody
        shell: bash
        run: |
          body=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          {
            echo 'body<<TAGEOF'
            echo "$body"
            echo 'TAGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: artifacts/

      - name: Mirror tag to lazysheet
        shell: bash
        run: |
          git remote add lazysheet \
            "https://x-access-token:${{ secrets.LAZYSHEET_APP_TOKEN }}@github.com/triasbrata/lazysheet.git"
          git push lazysheet "${{ github.ref_name }}"

      - name: Create release in lazysheet-app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LAZYSHEET_APP_TOKEN }}
          RELEASE_BODY: ${{ steps.tagbody.outputs.body }}
        run: |
          {
            echo "$RELEASE_BODY"
            echo
            echo "---"
            echo
            echo "### macOS — first launch"
            echo
            echo "Builds are unsigned, so macOS may report the app as \"damaged\". Remove the quarantine flag once, then open normally:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/LazySheet.app"'
            echo '```'
          } > /tmp/release-notes.md
          # download-artifact preserves the bundle/ subdir layout, so artifacts/
          # holds files (dmg) alongside dirs (deb, appimage, msi, nsis). gh only
          # uploads files, so collect them recursively.
          mapfile -t FILES < <(find artifacts -type f)
          if gh release view "${{ github.ref_name }}" --repo triasbrata/lazysheet >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --repo triasbrata/lazysheet \
              --notes-file /tmp/release-notes.md
            gh release upload "${{ github.ref_name }}" \
              --repo triasbrata/lazysheet \
              --clobber "${FILES[@]}"
          else
            gh release create "${{ github.ref_name }}" \
              --repo triasbrata/lazysheet \
              --title "LazySheet ${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md \
              "${FILES[@]}"
          fi

      - name: Delete workflow artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Assets now live on the lazysheet release; drop the Actions artifacts
          # from lazysheet-app to avoid storage bloat.
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"
          done
