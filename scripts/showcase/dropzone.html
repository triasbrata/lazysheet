<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lazysheet → website drop demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #zone {
      width: 70vw;
      height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px dashed #aaa;
      border-radius: 24px;
      background: #fff;
      color: #666;
      font-size: 2rem;
      font-weight: 500;
      text-align: center;
      padding: 2rem;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      cursor: default;
      user-select: none;
    }

    #zone .label {
      font-size: 1.1rem;
      font-weight: 400;
      color: #999;
      margin-top: 1rem;
    }

    #zone.highlight {
      border-color: #22c55e;
      background: #f0fdf4;
      color: #15803d;
    }

    #zone.dropped {
      border-color: #22c55e;
      border-style: solid;
      background: #dcfce7;
      color: #15803d;
    }
  </style>
</head>
<body>
  <div id="zone">
    Drag a file here from lazysheet
    <span class="label">Drop target — lazysheet native drag-out demo</span>
  </div>

  <script>
    const zone = document.getElementById('zone');

    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!zone.classList.contains('dropped')) {
        zone.classList.add('highlight');
      }
    });

    zone.addEventListener('dragleave', (e) => {
      zone.classList.remove('highlight');
    });

    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('highlight');
      const name = e.dataTransfer.files?.[0]?.name ?? '(file)';
      zone.innerHTML = '✅ Dropped: ' + name;
      zone.classList.add('dropped');
    });
  </script>
</body>
</html>
