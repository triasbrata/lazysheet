[serve.static]
plugins = ["bun-plugin-tailwind"]

[test]
# isolate = true runs each test file in a fresh global/module registry.
# Required to prevent cross-file mock.module leakage (C1): bun shares module registry
# across all files in one process; vi.mock() in file A persists into file B.
# --isolate gives each file its own registry, matching vitest's per-file isolation.
isolate = true
preload = ["./src/test/preload.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/unit"
coverageSkipTestFiles = true
# No coverageThreshold here: bun 1.3.14 cannot exclude files from coverage
# (no coveragePathIgnorePatterns — see rpi-progress.md D4), so the built-in
# gate would count src/test/preload.ts and entry points. The 95% line gate
# (with the old vitest exclude list) lives in scripts/coverage-total.ts,
# invoked by `bun run test`.
