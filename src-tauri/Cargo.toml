[package]
name = "lazysheet"
version = "0.5.0"
description = "LazySheet — Tauri v2 desktop app"
authors = ["edot"]
edition = "2021"

[lib]
name = "lazysheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
calamine = { version = "0.26", features = ["chrono"] }
umya-spreadsheet = "2"
csv = "1.3"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
anyhow = "1"
thiserror = "1"
tauri-plugin-drag = "2.1.1"
tauri-plugin-clipboard = "2.1.11"
# E2E WebDriver automation — optional, enabled by the `webdriver` feature for
# e2e builds only (`cargo build --features webdriver`). Never enabled by
# `tauri build` (release), so it never ships in production.
tauri-plugin-webdriver = { version = "0.2", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSView", "NSWindow"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGColor"] }

# Optimize dependencies even in dev builds. The app crate itself stays at
# opt-level 0 (fast incremental compiles), but deps like umya-spreadsheet are
# 10-15x faster when optimized — xlsx parse of a 71k-cell workbook drops from
# ~1.05s (debug) to ~85ms. Deps compile once and stay cached.
[profile.dev.package."*"]
opt-level = 3

# Shrink the shipped binary: fat LTO + single codegen unit let the linker drop
# far more dead code, `strip` removes symbols, and abort-on-panic drops the
# unwinding machinery. opt-level "s" trades a sliver of speed for size; the
# hot xlsx-parse path is dominated by IO/allocation, not codegen quality.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
# Embeds a W3C WebDriver server in the app (native WKWebView/WebKitGTK/WebView2)
# so tauri-webdriver can drive it cross-platform. e2e builds only.
# `tauri/custom-protocol` forces Tauri to serve the embedded frontendDist
# (../dist) instead of the dev server URL (localhost:1420). Without it a plain
# `cargo build` is a `dev` build that loads devUrl → blank window in e2e.
webdriver = ["dep:tauri-plugin-webdriver", "tauri/custom-protocol"]
# Same WebDriver server, but NO custom-protocol → the binary is a `dev` build
# that loads devUrl (localhost:1420). Run `VITE_E2E=true bun run dev` alongside
# it to drive specs against the live Vite server (HMR, no dist rebuild per change).
webdriver-dev = ["dep:tauri-plugin-webdriver"]
