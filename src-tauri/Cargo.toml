[package]
name = "lazysheet"
version = "0.5.0"
description = "LazySheet — Tauri v2 desktop app"
authors = ["edot"]
edition = "2021"

[lib]
name = "lazysheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
calamine = { version = "0.26", features = ["chrono"] }
umya-spreadsheet = "2"
csv = "1.3"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
anyhow = "1"
thiserror = "1"
tauri-plugin-drag = "2.1.1"
tauri-plugin-clipboard = "2.1.11"
# E2E WebDriver automation — optional, enabled by the `webdriver` feature for
# e2e builds only (`cargo build --features webdriver`). Never enabled by
# `tauri build` (release), so it never ships in production.
tauri-plugin-webdriver = { version = "0.2", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# Embeds a W3C WebDriver server in the app (native WKWebView/WebKitGTK/WebView2)
# so tauri-webdriver can drive it cross-platform. e2e builds only.
webdriver = ["dep:tauri-plugin-webdriver"]
